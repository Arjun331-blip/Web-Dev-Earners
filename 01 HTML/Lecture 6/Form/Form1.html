<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pete's Pizza Delivery</title>
    
</head>
<body>
    <div style="width: 30%;">
    <h1 style="text-align: center;">Pete's Pizza Delivery</h1>
    <h2 style="text-align: center;">Online Order Form</h2>
    <p style="text-align: center;">*required field</p>

    <form action="">
        <fieldset>
            <legend>Customer details</legend>
            <label for="fullName">*Name: </label>
            <input type="text" id="fullName" name="fullName">
            <br>
            <label for="address">*Address: </label>
            <input type="text" id="address" name="address">
            <br>
            <label for="city">*Town/City: </label>
            <input type="text" id="city" name="city">
            <br>
            <label for="postcode">*Postcode: </label>
            <input type="number" id="postcode" name="postcode">
            <br>
            <label for="tel">*Tel: </label>
            <input type="text" id="tel" name="telephone">
            <br>
            <label for="email">*Email: </label>
            <input type="text" id="email" name="email">
            <br><br>
        </fieldset>

        <div style="display: flex;">
        <fieldset width="">
            <legend>Topping *</legend>
            <input type="radio" name="topping" id="margherita">
            <label for="margherita">Margherita</label>
            <br>
            <input type="radio" name="topping" id="fourSeasons">
            <label for="fourSeasons">Four Seasons</label>
            <br>
            <input type="radio" name="topping" id="meatFeast">
            <label for="meatFeast">Meat Feast</label>
        </fieldset>

        <fieldset>
            <legend>Size *</legend>
            <input type="radio" name="size" id="small">
            <label for="small">Small</label>
            <br>
            <input type="radio" name="size" id="medium">
            <label for="medium">Medium</label>
            <br>
            <input type="radio" name="size" id="large">
            <label for="large">Large</label>
        </fieldset>
        <fieldset>
            <legend>Extras</legend>
            <input type="checkbox" name="extras" id="mushroom">
            <label for="mushroom">Mushrooms</label>
            <br>
            <input type="checkbox" name="extras" id="greenPeppers">
            <label for="greenPeppers">Green peppers</label>
            <br>
            <input type="checkbox" name="extras" id="anchovies">
            <label for="anchovies">Anchovies</label>
            <br>
            <input type="checkbox" name="extras" id="extraCheese">
            <label for="extraCheese">Extra cheese</label>
        </fieldset>
        </div>
        <fieldset>
            <legend>Delivery</legend>
            <label for="time">Preferred delivery time: </label>
            <input type="time" name="time" id="time">
            <br>
            <label for="instruction">Delivery instructions: </label>
            <textarea name="instruction" id="instruction" minlength="0" maxlength="40"></textarea>
        </fieldset>
        <button type="submit">Submit order</button>
    </form>
    </div>
</body>
</html>
