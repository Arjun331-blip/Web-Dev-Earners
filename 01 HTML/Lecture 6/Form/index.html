<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor tag and form in html</title>
</head>
<body>
    
    <a href="https://google.com" target="_blank">Google</a>

    <h1>form in html</h1>
    <div>
        
        <form action="https://google.com" target="_blank">

            <fieldset>
                <legend>Enter your basic details</legend>
            <label for="fullname">full name</label>
            <input type="text" id="fullname" placeholder="Entet your name">
            <br> <br>

            <label for="email">Email:</label>
            <input type="email" placeholder="e.g(nishant@gmail.com)" name="" id="email">
            <br><br>

            <label for="password">password</label>
            <input type="password" placeholder="enter your password" name="" id="password"><br><br>

            <label for="checkbox">are you 18+?</label>
            <input type="checkbox" id="checkbox"> <br><br>

            <label for="number">Phone number: </label>
            <input type="number" id="number" min="0"> <br><br>

            <label for="gender">Gender :</label>
            <label for="male">male</label>
            <input type="radio" id="male" name="gender">
            <label for="female">female</label>
            <input type="radio" id="female" name="gender">  <br><br>

            <label for="DOB">enter your DOB: </label>
            <input type="date" id="DOB">
            <br><br>

            <label for="file">Upload photo: </label>
            <input type="file" name="" id="file">
            <button type="submit">submit form</button>
            <br>
            <br>

            <label for="city">select your city</label>
            <select name="city" id="city">
                <option value="bhadohi">bhadohi</option>
                <option value="varansi" selected>varanasi</option>
                <option value="prayagraj">prayagraj</option>
            </select>

            </fieldset>
        </form>


    </div>
</body>
</html>
