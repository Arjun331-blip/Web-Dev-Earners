<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in Html</title>
    <style>
        table, tr, th,td {
            border: 2px solid rgb(78, 202, 61);
            border-collapse: collapse;
        }
    </style>
</head>

</html>
