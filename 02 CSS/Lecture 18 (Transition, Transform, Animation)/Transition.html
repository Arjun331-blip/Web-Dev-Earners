<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        body{
            width: 100%;
            height: 100%;
        }

        .container {
            background-color: blanchedalmond;
            width: 200px;
            height: 200px;
        }

        .container:hover {
            background-color: rgb(139, 56, 216);
            transition-duration: 1s;
            transition-property: background-color;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item item1 Linear">Linear</div>
        <div class="item item2 ease">ease</div>
        <div class="item item3 ease-in">ease-in</div>
        <div class="item item4 ease-out">ease-out</div>
        <div class="item item5 ease-in-out">ease-in-out</div>
    </div>
</body>
</html>
